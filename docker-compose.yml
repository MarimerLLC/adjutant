# Adjutant HTTP Server - Docker Compose Example
# Usage: docker compose up -d
#
# First-time setup:
#   1. Run: docker compose up -d
#   2. Read the generated admin token and MCP API key from: docker compose logs adjutant
#      (or set ADJUTANT_ADMIN_TOKEN / ADJUTANT_MCP_KEY below to choose your own)
#   3. Open http://localhost:8080/admin/ui, sign in with the admin token, and add accounts

services:
  adjutant:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - adjutant-data:/app/data
    environment:
      # Optional: admin API / console token. Leave unset and the server generates one on
      # first start, stores only its hash in the data volume, and logs it once.
      - ADJUTANT_ADMIN_TOKEN=${ADJUTANT_ADMIN_TOKEN:-}
      # Optional: MCP endpoint API key. Leave unset and the server generates one on first
      # start and logs it (docker compose logs adjutant). Set it here to control the key
      # from the deployment instead — it is then never written to the data volume.
      # - ADJUTANT_MCP_KEY=${ADJUTANT_MCP_KEY}
      # Optional: OpenTelemetry endpoint for observability
      # - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  adjutant-data:
    driver: local
