# Adjutant HTTP Server - Kubernetes Deployment
# All resources here are pinned to the adjutant namespace, so these commands
# do not depend on the namespace your kubectl context happens to default to.
# Prerequisites:
#   0. Create the namespace: kubectl create namespace adjutant
#   1. Create the secret: kubectl apply -f secret.yaml
#   2. Create the PVC: kubectl apply -f pvc.yaml
#   3. Deploy: kubectl apply -f deployment.yaml
#   4. Access via port-forward: kubectl port-forward -n adjutant svc/adjutant 8080:8080
#
# Public access: the Ingress below carries tailscale.com/funnel, shipped as "false" so a first
# apply comes up tailnet-only. Claim the server from inside the tailnet, work through
# docs/PUBLIC-ACCESS.md, then set it to "true" and apply again. Once it is "true", every later
# apply (an image bump included) keeps the server public.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adjutant
  namespace: adjutant
  labels:
    app: adjutant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adjutant
  template:
    metadata:
      labels:
        app: adjutant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: adjutant
          image: docker.io/rockylhotka/adjutant:2.1.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ADJUTANT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: adjutant-secrets
                  key: admin-token
            # Optional: supply the MCP endpoint API key from the Secret rather than letting the
            # server generate one onto the PVC at first start. Uncomment together with the
            # mcp-api-key entry in secret.yaml.
            # - name: ADJUTANT_MCP_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: adjutant-secrets
            #       key: mcp-api-key
            # The public origin: drives OIDC redirect URIs, the MCP OAuth issuer and the Secure /
            # __Host- session cookie. The pod only sees plain HTTP behind the Tailscale proxy, so it
            # cannot work this out itself. Must match tailscale.com/hostname on the Ingress below.
            - name: ADJUTANT_Adjutant__ExternalBaseUrl
              value: "https://adjutant.tail920062.ts.net"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.loki.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "adjutant"
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adjutant-data
---
apiVersion: v1
kind: Service
metadata:
  name: adjutant
  namespace: adjutant
  labels:
    app: adjutant
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: adjutant
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adjutant-tailscale
  namespace: adjutant
  annotations:
    tailscale.com/hostname: adjutant
    # The operator's default tag (tag:k8s) is not permitted by the tailnet ACL.
    tailscale.com/tags: tag:k8s-operator
    # "true" publishes this host to the internet through Tailscale Funnel. Prerequisites, all
    # checked in docs/PUBLIC-ACCESS.md: MCP keys enforced, a sign-in provider configured and the
    # server claimed (admin-users.json exists), the image above refuses the admin token over
    # Funnel (2.0.0 does not; bump it to a release that does in the same change), and the tailnet
    # policy granting the "funnel" node attribute to tag:k8s-operator.
    # To un-publish, set it back to "false" and apply again.
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - adjutant.tail920062.ts.net
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adjutant
                port:
                  number: 8080
